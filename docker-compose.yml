version: '3.8'

services:
  # 1. The Central Database
  db:
    image: postgres:15-alpine
    container_name: p2p-music-db
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-p2pmusic_secret}
      POSTGRES_USER: ${DB_USER:-p2pmusic}
      POSTGRES_DB: ${DB_NAME:-p2pmusic}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/lib/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-p2pmusic}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - p2p-network

  # 2. The Private Tracker (Peer Discovery)
  tracker:
    build:
      context: .
      dockerfile: Dockerfile.tracker
    container_name: p2p-music-tracker
    ports:
      - "8000:8000"
      - "8000:8000/udp"
    environment:
      DATABASE_URL: postgres://${DB_USER:-p2pmusic}:${DB_PASSWORD:-p2pmusic_secret}@db:5432/${DB_NAME:-p2pmusic}
      TRACKER_HOST: 0.0.0.0
      TRACKER_PORT: 8000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - p2p-network

  # 3. Coturn TURN Server
  coturn:
    image: coturn/coturn:latest
    container_name: p2p-music-coturn
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/tcp"
    volumes:
      - ./infrastructure/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    environment:
      - TZ=UTC
    command: [
      "--config", "/etc/coturn/turnserver.conf",
      "--daemon", "false"
    ]
    networks:
      - p2p-network

  # 4. The Web UI (Next.js)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: p2p-music-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://${DB_USER:-p2pmusic}:${DB_PASSWORD:-p2pmusic_secret}@db:5432/${DB_NAME:-p2pmusic}
      - TRACKER_URL=wss://tracker.${DOMAIN:-localhost}:8000
      - NEXT_PUBLIC_TURN_SERVER=turn:${DOMAIN:-localhost}:3478
      - NEXT_PUBLIC_TURN_USERNAME=${TURN_USERNAME:-turnuser}
      - NEXT_PUBLIC_TURN_PASSWORD=${TURN_PASSWORD:-turnpassword}
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - NEXTAUTH_URL=https://${DOMAIN:-localhost}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - p2p-network

  # 5. Redis (Optional - for caching and rate limiting)
  redis:
    image: redis:7-alpine
    container_name: p2p-music-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - p2p-network

volumes:
  pgdata:
  redis-data:

networks:
  p2p-network:
    driver: bridge
