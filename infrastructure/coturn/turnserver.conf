# Coturn TURN Server Configuration
# for P2P Music Platform

# Listening port
listening-port=3478
tls-listening-port=5349

# Server settings
fingerprint
lt-cred-mech
user=${TURN_USERNAME:-turnuser}:${TURN_PASSWORD:-turnpassword}
realm=platform.example.com

# Authentication
use-auth-secret
static-auth-secret=${TURN_STATIC_SECRET:-your-static-auth-secret}

# Performance
total-quota=100
bps-capacity=0

# Security
stale-nonce
no-multicast-peers
no-tlsv1
no-tlsv1.1

# Logging
syslog
verbose

# Database (optional - for long-term credentials)
# sqlite-db=/var/lib/turn/turndb

# SSL/TLS certificates (uncomment for production)
# cert=/etc/letsencrypt/live/platform.example.com/cert.pem
# pkey=/etc/letsencrypt/live/platform.example.com/privkey.pem

# Allowed peers (optional - restrict to known peers)
# allowed-peer-ip=127.0.0.1
# allowed-peer-ip=::1

# External IP (if behind NAT)
# external-ip=203.0.113.1

# Relay address range
# relay-ip-range=10.0.0.1-10.0.0.255

# Coturn admin web interface (optional)
# admin-port=6678
# admin-user=admin
# admin-password=${TURN_ADMIN_PASSWORD:-adminpassword}
