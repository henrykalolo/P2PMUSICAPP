# /etc/nginx/sites-available/p2p-music-platform
# Copy to /etc/nginx/sites-enabled/p2p-music-platform

upstream nextjs {
  server 127.0.0.1:3000;
  keepalive 32;
}

upstream tracker {
  server 127.0.0.1:8000;
  keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name platform.example.com;

    # SSL Configuration (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/platform.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/platform.example.com/privkey.pem;
    
    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 1. Next.js Web App & API
    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts for P2P connections
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 2. WebSocket P2P Tracker (Crucial for WebTorrent)
    location /tracker {
        proxy_pass http://tracker;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Increase timeouts for long-lived P2P connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        
        # WebSocket specific
        proxy_buffering off;
        proxy_cache off;
    }

    # 3. Static Assets
    location /_next/static {
        proxy_cache STATIC;
        proxy_pass http://nextjs;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 4. Health check endpoint
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # 5. Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# HTTP redirect to HTTPS
server {
    listen 80;
    server_name platform.example.com;
    
    location / {
        return 301 https://$host$request_uri;
    }
    
    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
}
